# Publish this package to crates.io.
#
# Fires automatically on a v*.*.* tag, or manually to retry a failed publish.
# Manual runs must state the version they expect to publish; the job refuses
# to run if the checked-out sources disagree. crates.io versions are
# immutable - if a publish fails after landing there, bump the version rather
# than retrying it.
#
# Authenticates with crates.io trusted publishing (OIDC): the job trades a
# GitHub-issued identity token for a crates.io token that lives only for this
# run and is revoked when the job ends. crates.io trusts exactly this file -
# nikolchaa/tauri-plugin-hwinfo, workflow `publish-crates.yml` - so renaming it
# breaks publishing until the crate's trusted publisher is updated to match.

name: Publish (crates.io)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, tag or commit to publish from"
        required: false
        default: ""
      version:
        description: "Expected version, e.g. 1.0.0-alpha.2 (required for manual runs)"
        required: false
        default: ""

permissions:
  contents: read
  # Lets the job request the OIDC token crates.io exchanges for a publish token.
  id-token: write

concurrency:
  group: publish-crates-${{ inputs.branch || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # Same bounded, retrying install as ci.yml.
      - name: Install system dependencies
        timeout-minutes: 20
        run: |
          bash .github/scripts/apt-install.sh \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      # On a tag push the expected version is the tag itself; manual runs
      # must supply one, and either way the source has to agree.
      - name: Verify version matches the requested release
        run: |
          want="${{ inputs.version || github.ref_name }}"
          want="${want#v}"
          have="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$want" != "$have" ]; then
            echo "::error::requested $want but Cargo.toml says $have"
            exit 1
          fi

      # Last step before publishing, so the short-lived token exists for as
      # little time as possible.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
