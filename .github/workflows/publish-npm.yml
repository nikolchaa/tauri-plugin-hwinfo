# Publish the TypeScript bindings to npm.
#
# Fires automatically on a v*.*.* tag, or manually to retry a failed publish.
# Pure Node job - no Rust toolchain needed, since the package ships only the
# rollup'd contents of guest-js/. Pre-release versions (any `-` suffix) ride
# under the `beta` dist-tag so plain installs never see them.
#
# Authenticates with npm trusted publishing (OIDC): no token is stored in the
# repository. npmjs.com trusts exactly this file - nikolchaa/tauri-plugin-hwinfo,
# workflow `publish-npm.yml` - so renaming it breaks publishing until the
# trusted publisher on npmjs.com is updated to match. Provenance is attached
# automatically because the repository is public.

name: Publish (npm)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, tag or commit to publish from"
        required: false
        default: ""
      version:
        description: "Expected version, e.g. 1.0.0-alpha.2 (required for manual runs)"
        required: false
        default: ""

permissions:
  contents: read
  # Lets the job request the OIDC token npm exchanges for a publish credential.
  id-token: write

concurrency:
  group: publish-npm-${{ inputs.branch || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Ensure npm supports trusted publishing
        run: |
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a==11&&(b>5||(b==5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify version matches the requested release
        run: |
          want="${{ inputs.version || github.ref_name }}"
          want="${want#v}"
          have="$(node -p 'require("./package.json").version')"
          if [ "$want" != "$have" ]; then
            echo "::error::requested $want but package.json says $have"
            exit 1
          fi

      # Derived from package.json after the check above, so the dist-tag can
      # never disagree with what is actually being shipped.
      - name: Determine dist-tag
        id: disttag
        run: |
          echo "tag=$(node -p 'require("./package.json").version.includes("-") ? "beta" : "latest"')" >> "$GITHUB_OUTPUT"

      # pnpm still installs and builds (via prepublishOnly); the upload itself
      # goes through the npm CLI, which is what implements the OIDC exchange.
      - name: Publish to npm
        run: npm publish --tag ${{ steps.disttag.outputs.tag }}
