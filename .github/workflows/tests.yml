# Manual, on-demand cross-platform test runs.
#
# Deliberately NOT wired to push/pull_request: this suite runs real hardware
# scans and costs minutes of paid macOS/Windows runner time, so it only fires
# when someone asks for it from the Actions tab (or via `gh workflow run`),
# against any branch they name.
#
# Runners:
#   ubuntu-latest   x86_64 Linux   - needs GTK/WebKit/dbus dev packages for Tauri;
#                                    lavapipe + PoCL give it a Vulkan and an OpenCL device
#   macos-latest    Apple Silicon  - macOS 26 since June 2026
#   macos-15-intel  x86_64 macOS   - last Intel image; supported until Aug 2027
#   windows-latest  x86_64 Windows
#
# Plus a type-check of the mobile targets (Android on Linux, iOS on macOS).
# The cheap per-push gate lives in ci.yml.

name: Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, tag or commit to test (empty = current default branch)"
        required: false
        default: ""
      run-example:
        description: "Also run the `dump` example for a full JSON smoke test"
        type: boolean
        required: false
        default: true
      profiler-dump:
        description: "macOS: print raw system_profiler JSON for the disk/memory reports"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Report every platform's result rather than stopping at the first red.
      fail-fast: false
      # `gpu-apis` is what each runner's stack is known to expose; see
      # `expected_gpu_apis_are_detected` in tests/scan.rs.
      matrix:
        include:
          - os: ubuntu-latest
            gpu-apis: vulkan,opencl
          - os: macos-latest
            gpu-apis: metal
          - os: macos-15-intel
            gpu-apis: metal
          - os: windows-latest
            gpu-apis: directx

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # Same bounded, retrying install as ci.yml.
        timeout-minutes: 20
        run: |
          bash .github/scripts/apt-install.sh \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            pkg-config \
            libvulkan1 \
            mesa-vulkan-drivers \
            ocl-icd-libopencl1 \
            pocl-opencl-icd

      # Ground truth for report-shape questions. The parsers in
      # src/sys/macos/mod.rs are written against these documents; when Apple
      # reshuffles keys, this output is the spec.
      - name: Dump system_profiler reports (macOS diagnostics)
        if: runner.os == 'macOS' && inputs.profiler-dump
        run: |
          for dt in SPNVMeDataType SPSerialATADataType SPDiscDataType SPStorageDataType SPMemoryDataType; do
            echo "=== $dt ==="
            system_profiler -json -detailLevel full "$dt" 2>/dev/null | head -c 4000 || true
            echo
          done

      - name: Build (all targets, all features)
        run: cargo build --all-targets --all-features

      - name: Unit and integration tests
        env:
          HWINFO_EXPECT_GPU_APIS: ${{ matrix.gpu-apis }}
        run: cargo test --all-features -- --nocapture

      # Safe mode keeps hardware identifiers out of the public CI log and the
      # artifact; this step proves the whole pipeline produces parseable JSON
      # without crashing.
      - name: Smoke test - dump example as JSON
        if: inputs.run-example
        shell: bash
        run: |
          mkdir -p target/scans
          cargo run --example dump -- safe full > "target/scans/${{ matrix.os }}.json"
          cat "target/scans/${{ matrix.os }}.json"

      # The scan each runner actually produced, for reading values rather than
      # just shapes: what a GPU, disk or display looks like on that platform.
      - name: Upload scan
        if: inputs.run-example && always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-${{ matrix.os }}
          path: target/scans/${{ matrix.os }}.json
          if-no-files-found: warn

      # Advisory: lint findings are visible in the log but do not fail the run.
      # Platform-specific lints are expected to drift; the build/test gates above
      # are the pass/fail signal.
      - name: Clippy (advisory)
        run: cargo clippy --all-targets --all-features
        continue-on-error: true

  # Mobile targets are type-checked only: there is no device to run a scan on,
  # and linking would need the NDK / an Xcode project for no extra signal.
  # iOS needs the Apple SDK, so it has to run on a macOS runner.
  mobile:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: macos-latest
            target: aarch64-apple-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: clippy

      - name: Clippy (${{ matrix.target }})
        run: cargo clippy --lib --all-features --target ${{ matrix.target }} -- -D warnings
