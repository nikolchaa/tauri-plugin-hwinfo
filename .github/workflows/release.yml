name: Release

on:
  push:
    tags:
      - "v*.*.*" # Trigger on version tag
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  publish:
    name: Publish to npm & crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org/"

      - name: Install GTK3 development dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --token $CARGO_REGISTRY_TOKEN

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies for npm
        run: pnpm install

      # Pre-release versions (1.0.0-alpha.1) must not satisfy plain
      # `npm install`; they ride under a beta dist-tag until the version
      # carries no suffix.
      - name: Determine npm dist-tag
        id: disttag
        run: |
          echo "tag=$(node -p 'require("./package.json").version.includes("-") ? "beta" : "latest"')" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --tag ${{ steps.disttag.outputs.tag }}
