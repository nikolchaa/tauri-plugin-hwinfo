# Fast gate on every push and pull request.
#
# Linux runners only, so it costs nothing on a public repository and finishes
# in a few minutes. The real cross-platform hardware runs (macOS, Windows, iOS)
# stay in tests.yml, which is manual.
#
# What this catches before a tag ever reaches the publish workflows:
#   - formatting and lint drift
#   - a broken Linux build or a failing test
#   - the crate no longer building on its declared `rust-version`
#   - Android no longer compiling (no runner needed - `cargo check` only)
#   - the TypeScript bindings no longer building
#   - the TypeScript types drifting from the serde output of the Rust models

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Linux - fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      # The image identifies the Ubuntu release, so a migration to a new one
      # starts a fresh package cache instead of restoring the old release's.
      - name: Identify runner image
        id: image
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      # ~90 MB of GTK/WebKit packages, downloaded once and reused: the Azure
      # mirror has crawled at ~40 KB/s, and a cache hit skips it entirely.
      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ github.job }}-${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml', '.github/scripts/apt-install.sh') }}
          restore-keys: apt-${{ github.job }}-${{ steps.image.outputs.id }}-

      # Bare apt-get has hung this step to the job timeout; the script bounds and
      # retries every stage of it.
      - name: Install Linux system dependencies
        timeout-minutes: 25
        run: |
          APT_ARCHIVES="$HOME/apt-archives" bash .github/scripts/apt-install.sh \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            pkg-config \
            libvulkan1 \
            mesa-vulkan-drivers \
            ocl-icd-libopencl1 \
            pocl-opencl-icd

      - name: Formatting
        run: cargo fmt --all --check

      # Gating here, unlike the advisory clippy in tests.yml: one platform's
      # lints are stable enough to hold the line on.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --lib --no-default-features -- -D warnings

      # Includes tests/contract.rs, which pins the fully populated fixtures in
      # tests/contract/ to src/models.rs. lavapipe and PoCL, installed above,
      # give the runner real Vulkan and OpenCL devices to detect.
      - name: Tests
        env:
          HWINFO_EXPECT_GPU_APIS: vulkan,opencl
        run: cargo test --all-features

      # The real scan proves the TypeScript types against actual output; the
      # fixtures cover every field this runner leaves null or empty.
      - name: Dump a real scan
        run: |
          mkdir -p target/contract
          cargo run --quiet --all-features --example dump -- unsafe full > target/contract/scan.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript types match the serde output
        run: node tests/contract/check.mjs target/contract/scan.json

      # Proves the crate packages and builds from the tarball crates.io would
      # receive, without publishing anything.
      - name: Package dry run
        run: cargo publish --dry-run --allow-dirty

  # Builds on the oldest toolchain `rust-version` promises. Every other job uses
  # stable, which is how the declared 1.82 drifted below sysinfo's 1.95 unseen.
  # The version is read from Cargo.toml so a bump there can't skip this job.
  msrv:
    name: Linux - MSRV cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # `cargo check` never links, so the GTK/WebKit `-sys` build scripts only
      # need pkg-config to say the libraries exist. A stub that always does
      # replaces the apt install, which is what used to stall this job.
      - name: Stub pkg-config
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/pkg-config" <<'EOF'
          #!/bin/sh
          case " $* " in *" --modversion "*) echo 99.0 ;; *) echo ;; esac
          EOF
          chmod +x "$RUNNER_TEMP/bin/pkg-config"
          echo "PKG_CONFIG=$RUNNER_TEMP/bin/pkg-config" >> "$GITHUB_ENV"

      - name: Check (all targets, all features)
        run: cargo check --all-targets --all-features

      - name: Check (no default features)
        run: cargo check --lib --no-default-features

  android:
    name: Android - cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          components: clippy

      # Type-checking needs no NDK: nothing is linked.
      - name: Clippy (aarch64-linux-android)
        run: cargo clippy --lib --all-features --target aarch64-linux-android -- -D warnings

  js:
    name: TypeScript bindings
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # Lists the files a publish would ship, driven by package.json `files`.
      - name: Pack dry run
        run: npm pack --dry-run
